services:
  coturn:
    command: -c /etc/coturn/turnserver.conf
    container_name: pyterm_coturn
    dns:
    - 8.8.8.8
    - 114.114.114.114
    - 223.5.5.5
    image: coturn/coturn:latest
    ports:
    - 19302:19302/tcp
    - 19302:19302/udp
    - 5349:5349/tcp
    - 5349:5349/udp
    - 49160-49259:49160-49259/udp
    restart: unless-stopped
    volumes:
    - ./config/turnserver.conf:/etc/coturn/turnserver.conf:ro
    - ./config/turn_cert.pem:/etc/coturn/turn_cert.pem:ro
    - ./config/turn_key.pem:/etc/coturn/turn_key.pem:ro
  mariadb:
    container_name: pyterm_mariadb
    environment:
      MYSQL_DATABASE: ppy_tools
      MYSQL_PASSWORD: change_me_pass
      MYSQL_ROOT_PASSWORD: pyterm_root_2026
      MYSQL_USER: ppy
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      timeout: 5s
    image: mariadb:latest
    ports:
    - 127.0.0.1:3306:3306
    restart: unless-stopped
    volumes:
    - ./mariadb_data:/var/lib/mysql
  md:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyterm_md
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
    - .env
    environment:
    - TZ=Asia/Shanghai
    - CONFIG_DIR=/app/config
    - LOGS_DIR=/app/logs
    - DATA_DIR=/app/md
    - DB_HOST=mariadb
    - DB_PORT=3306
    - DB_USER=ppy
    - DB_PASS=change_me_pass
    - DB_NAME=ppy_tools
    - JWT_SECRET=change_me_jwt
    - CREDENTIAL_KEY=
    - JWT_EXPIRES_HOURS=24
    - TURN_SECRET=change_me_turn
    - MINIO_ENDPOINT=minio:9000
    - MINIO_ACCESS_KEY=minioadmin
    - MINIO_SECRET_KEY=change_me_minio
    - MINIO_BUCKET=pyterm-docs
    - RELEASES_DIR=/app/releases
    image: pyterm/md:latest
    restart: unless-stopped
    volumes:
    - ./app:/app/app:ro
    - ./web/dist:/app/static:ro
    - ./ftproot:/app/ftproot
    - ./config:/app/config
    - ./logs:/app/logs
    - ./md:/app/md
    - ./releases:/app/releases:ro
    - /etc/localtime:/etc/localtime:ro
    - /etc/timezone:/etc/timezone:ro
  minio:
    command: server /data --console-address :9001
    container_name: pyterm_minio
    dns:
    - 8.8.8.8
    - 114.114.114.114
    - 223.5.5.5
    environment:
      MINIO_ROOT_PASSWORD: change_me_minio
      MINIO_ROOT_USER: minioadmin
    image: minio/minio:latest
    ports:
    - 9001:9001
    restart: unless-stopped
    volumes:
    - ./minio_data:/data
  nginx:
    container_name: pyterm_nginx
    depends_on:
    - md
    dns:
    - 8.8.8.8
    - 114.114.114.114
    - 223.5.5.5
    image: nginx:alpine
    ports:
    - 5588:5588
    restart: unless-stopped
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./nginx/ssl:/etc/nginx/ssl:ro
  test:
    build:
      context: .
      dockerfile: Dockerfile
    command:
    - 'echo Waiting for md to start...'
    container_name: pyterm_test
    depends_on:
      mariadb:
        condition: service_healthy
      md:
        condition: service_started
    entrypoint:
    - sh
    - -c
    env_file:
    - .env
    environment:
    - TZ=Asia/Shanghai
    - BASE_URL=http://md:5588
    - CONFIG_DIR=/app/config
    - LOGS_DIR=/app/logs
    - DATA_DIR=/app/md
    - DB_HOST=mariadb
    - DB_PORT=3306
    - DB_USER=ppy
    - DB_PASS=change_me_pass
    - DB_NAME=ppy_tools
    - TESTING=1
    healthcheck:
      disable: true
    profiles:
    - test
    volumes:
    - ./app:/app/app
    - ./web:/app/web
    - ./autotest:/app/autotest
    - ./config:/app/config
    - ./md:/app/md
    - ./logs:/app/logs
    - /etc/localtime:/etc/localtime:ro
    - /etc/timezone:/etc/timezone:ro
  test-ssh-server:
    container_name: pyterm_test_ssh
    environment:
    - TZ=Asia/Shanghai
    - SSH_USER=sshuser
    - SSH_PASSWORD=change_me_sshpass
    - SSH_PORT=22
    - SFTP_USER=sftpuser
    - SFTP_PASSWORD=change_me_sftppass
    - SFTP_PORT=2223
    - RDP_USER=rdpuser
    - RDP_PASSWORD=rdpPass123
    - VNC_PASSWORD=vncPass123
    - SOCKS5_USER=socksuser
    - SOCKS5_PASSWORD=socksPass123
    image: nexterm_test_ubuntu-test-server
    ports:
    - '2222:22'
    - '5900:5900'
    - '3389:3389'
    restart: unless-stopped
  # pyagent 单二进制（agent+gateway 双模式，mode 由各自 config.json 决定）
  # 三个实例共用 pyterm/pyagent:latest 与同一份 ./pyagent/pyagent 二进制
  wragent:
    image: pyterm/pyagent:latest
    build:
      context: ./pyagent
      dockerfile: Dockerfile
    container_name: pyterm_wragent
    environment:
    - GOMEMLIMIT=256MiB
    - PYAGENT_PPROF_ADDR=127.0.0.1:6061
    - TZ=Asia/Shanghai
    - HOST_CONSOLE=1
    - PERSIST_BIN=/app/pyagent
    - PION_LOG_DEBUG=${PION_LOG_DEBUG:-}
    - PION_LOG_TRACE=${PION_LOG_TRACE:-}
    command: sh -c "cp /app/pyagent /usr/local/bin/pyagent && exec /usr/local/bin/pyagent -config /config.json"
    network_mode: host
    pid: host
    privileged: true
    restart: unless-stopped
    volumes:
    - ./pyagent/pyagent:/app/pyagent
    - ./pyagent/config.json:/config.json
    - /:/host:rw
  wragent2:
    image: pyterm/pyagent:latest
    build:
      context: ./pyagent
      dockerfile: Dockerfile
    container_name: pyterm_wragent2
    environment:
    - GOMEMLIMIT=256MiB
    - PYAGENT_PPROF_ADDR=127.0.0.1:6062
    - TZ=Asia/Shanghai
    - HOST_CONSOLE=1
    - PERSIST_BIN=/app/pyagent
    command: sh -c "cp /app/pyagent /usr/local/bin/pyagent && exec /usr/local/bin/pyagent -config /config2.json"
    network_mode: host
    pid: host
    privileged: true
    restart: unless-stopped
    volumes:
    - ./pyagent/pyagent:/app/pyagent
    - ./pyagent/config2.json:/config2.json
    - /:/host:rw
  wrgateway:
    image: pyterm/pyagent:latest
    build:
      context: ./pyagent
      dockerfile: Dockerfile
    container_name: pyterm_wrgateway
    environment:
    - GOMEMLIMIT=256MiB
    - PYAGENT_PPROF_ADDR=127.0.0.1:6060
    - TZ=Asia/Shanghai
    - PERSIST_BIN=/app/pyagent
    command: sh -c "cp /app/pyagent /usr/local/bin/pyagent && exec /usr/local/bin/pyagent -config /etc/pyagent/config.json"
    network_mode: host
    restart: unless-stopped
    volumes:
    - ./pyagent/pyagent:/app/pyagent
    - ./pyagent/config-gateway.json:/etc/pyagent/config.json
    - ./pyagent/ssl:/etc/pyagent/ssl:ro
