# coturn 配置文件 - 参考 webrtc-tunnel-proxy 风格
listening-port=19302
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=203.0.113.10

# 认证设置 - 使用共享密钥认证
realm=pyterm.local
use-auth-secret
static-auth-secret=change_me_turn

# TLS/SSL设置
cert=/etc/coturn/turn_cert.pem
pkey=/etc/coturn/turn_key.pem

# 日志配置
log-file=stdout
verbose
simple-log

# 安全设置
no-cli
fingerprint
stale-nonce=600

# 性能优化 (100 ports: 49160-49259)
min-port=49160
max-port=49259
no-multicast-peers
