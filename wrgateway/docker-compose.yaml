version: "3.8"

services:
  wrgateway:
    build: .
    image: pyterm/wrgateway:latest
    container_name: wrgateway
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./config.json:/etc/wrgateway/config.json:ro
      - ./ssl:/etc/wrgateway/ssl:ro
    environment:
      - WRG_LISTEN=:443
      - WRG_SERVER_URL=${WRG_SERVER_URL:-wss://管理平台IP:5588/api/ws/webrtc}
      - WRG_GATEWAY_ID=${WRG_GATEWAY_ID:-gw-001}
      - WRG_GATEWAY_TOKEN=${WRG_GATEWAY_TOKEN:-}
      - WRG_JWT_SECRET=${WRG_JWT_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
