<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>编辑器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #editor-container { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }

    /* Top toolbar */
    .editor-toolbar {
      display: flex; align-items: center; gap: 12px;
      padding: 6px 16px; border-bottom: 1px solid #1e293b;
      background: #1e293b; flex-shrink: 0; min-height: 40px;
    }
    .editor-toolbar .file-name { font-size: 14px; font-weight: 600; white-space: nowrap; }
    .editor-toolbar .file-path { font-size: 12px; color: #94a3b8; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .editor-toolbar .status { font-size: 12px; padding: 2px 8px; border-radius: 4px; }
    .status-saved { color: #34d399; }
    .status-unsaved { color: #fbbf24; }
    .status-error { color: #f87171; }
    .toolbar-btn {
      padding: 5px 12px; border-radius: 4px; border: none;
      cursor: pointer; font-size: 12px; font-weight: 500;
    }
    .btn-save { background: #2563eb; color: #fff; }
    .btn-save:hover { background: #1d4ed8; }
    .btn-save:disabled { opacity: .5; cursor: not-allowed; }
    .btn-close { background: #334155; color: #e2e8f0; }
    .btn-close:hover { background: #475569; }

    /* Format toolbar */
    .format-bar {
      display: flex; align-items: center; gap: 2px;
      padding: 4px 16px; border-bottom: 1px solid #1e293b;
      background: #1e293b; flex-shrink: 0;
    }
    .fmt-btn {
      background: #1e293b; border: 1px solid #334155; color: #94a3b8;
      padding: 5px 10px; border-radius: 4px; cursor: pointer;
      font-size: 13px; line-height: 1; font-family: inherit;
    }
    .fmt-btn:hover { background: #334155; color: #e2e8f0; border-color: #475569; }
    .fmt-sep { width: 1px; height: 18px; background: #334155; margin: 0 4px; }
    .view-btn {
      background: #1e293b; border: 1px solid #334155; color: #94a3b8;
      padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    .view-btn:hover { background: #334155; color: #e2e8f0; }
    .view-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    /* Split container */
    .editor-split { display: flex; flex: 1; overflow: hidden; min-height: 0; }
    .editor-pane { flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .editor-pane .cm-editor { flex: 1; min-height: 0; }
    .editor-pane .cm-editor .cm-scroller { min-height: 0; }
    .preview-pane {
      flex: 1; overflow-y: auto; padding: 20px 28px;
      border-left: 1px solid #1e293b; min-width: 0; min-height: 0;
    }
    .preview-pane.hidden { display: none; }
    .editor-pane.hidden { display: none; }

    /* Loading / Error */
    .loading { display: flex; align-items: center; justify-content: center;
      height: 100%; color: #94a3b8; font-size: 16px; }
    .error { display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; color: #f87171; gap: 12px; }
    .error button { padding: 8px 20px; background: #2563eb; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; }

    /* ===== Markdown preview body ===== */
    .markdown-body { font-size: 15px; line-height: 1.7; word-wrap: break-word; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4,
    .markdown-body h5, .markdown-body h6 { margin-top: 1.2em; margin-bottom: 0.6em; font-weight: 600; line-height: 1.3; }
    .markdown-body h1 { font-size: 2em; border-bottom: 1px solid #334155; padding-bottom: 0.3em; }
    .markdown-body h2 { font-size: 1.5em; border-bottom: 1px solid #334155; padding-bottom: 0.3em; }
    .markdown-body h3 { font-size: 1.25em; }
    .markdown-body h4 { font-size: 1em; }
    .markdown-body p { margin: 0.8em 0; }
    .markdown-body a { color: #60a5fa; text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; }
    .markdown-body blockquote {
      margin: 1em 0; padding: 0.5em 1em;
      border-left: 4px solid #2563eb; background: #1e293b33; color: #94a3b8;
    }
    .markdown-body ul, .markdown-body ol { padding-left: 2em; margin: 0.6em 0; }
    .markdown-body li { margin: 0.25em 0; }
    .markdown-body code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.88em; background: #1e293b; color: #e2e8f0;
      padding: 0.15em 0.4em; border-radius: 4px;
    }
    .markdown-body pre {
      margin: 1em 0; padding: 14px 16px;
      background: #0b1220; color: #e2e8f0;
      border-radius: 8px; overflow-x: auto; line-height: 1.55;
    }
    .markdown-body pre code { background: none; color: inherit; padding: 0; font-size: 0.86em; }
    .markdown-body table { border-collapse: collapse; margin: 1em 0; width: 100%; display: block; overflow-x: auto; }
    .markdown-body th, .markdown-body td { border: 1px solid #334155; padding: 8px 14px; text-align: left; white-space: nowrap; }
    .markdown-body th { background: #1e293b; font-weight: 600; }
    .markdown-body tr:nth-child(even) { background: #1e293b44; }
    .markdown-body img { max-width: 100%; border-radius: 6px; }
    .markdown-body hr { border: none; border-top: 1px solid #334155; margin: 1.5em 0; }
    .markdown-body .mermaid-wrap { text-align: center; margin: 1em 0; cursor: pointer; transition: box-shadow 0.2s; }
    .markdown-body .mermaid-wrap:hover { box-shadow: 0 0 0 2px #3b82f6; }
    .mermaid-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; cursor: zoom-out; overflow: auto; padding: 20px; }
    .mermaid-overlay svg { max-width: 90vw; max-height: 90vh; width: auto; height: auto; background: #1e293b; border-radius: 8px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }

    /* hljs One Dark colors */
    .markdown-body .hljs-keyword, .markdown-body .hljs-selector-tag,
    .markdown-body .hljs-literal, .markdown-body .hljs-doctag { color: #c678dd; }
    .markdown-body .hljs-string, .markdown-body .hljs-attr,
    .markdown-body .hljs-regexp { color: #98c379; }
    .markdown-body .hljs-number, .markdown-body .hljs-title,
    .markdown-body .hljs-function { color: #61afef; }
    .markdown-body .hljs-comment, .markdown-body .hljs-quote { color: #7f848e; font-style: italic; }
    .markdown-body .hljs-built_in, .markdown-body .hljs-type,
    .markdown-body .hljs-class { color: #e5c07b; }
    .markdown-body .hljs-variable, .markdown-body .hljs-template-variable { color: #e06c75; }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading" id="loading">正在加载文件...</div>
    <div class="error" id="error" style="display:none">
      <div id="error-msg"></div>
      <button onclick="window.close()">关闭</button>
    </div>
    <div id="editor-container" style="display:none">
      <div class="editor-toolbar">
        <span class="file-name" id="file-name"></span>
        <span class="file-path" id="file-path"></span>
        <span class="status status-saved" id="status">已保存</span>
        <button class="toolbar-btn btn-save" id="btn-save" disabled>💾 保存</button>
        <button class="toolbar-btn btn-close" onclick="window.close()">✕ 关闭</button>
      </div>
      <div class="format-bar" id="format-bar" style="display:none">
        <button class="fmt-btn" data-fmt="bold" title="加粗 Ctrl+B"><b>B</b></button>
        <button class="fmt-btn" data-fmt="italic" title="斜体 Ctrl+I"><i>I</i></button>
        <button class="fmt-btn" data-fmt="strike" title="删除线"><s>S</s></button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" data-fmt="h2" title="标题">H2</button>
        <button class="fmt-btn" data-fmt="h3" title="小标题">H3</button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" data-fmt="link" title="链接">🔗</button>
        <button class="fmt-btn" data-fmt="image" title="图片">📷</button>
        <button class="fmt-btn" data-fmt="table" title="表格">▦</button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" data-fmt="quote" title="引用">❝</button>
        <button class="fmt-btn" data-fmt="code" title="代码块">&lt;/&gt;</button>
        <button class="fmt-btn" data-fmt="list" title="列表">≡</button>
        <span class="fmt-sep"></span>
        <button class="view-btn" id="btn-view-edit" title="仅编辑">编辑</button>
        <button class="view-btn active" id="btn-view-split" title="分屏">分屏</button>
        <button class="view-btn" id="btn-view-preview" title="仅预览">预览</button>
      </div>
      <div class="editor-split">
        <div class="editor-pane" id="editor-pane"></div>
        <div class="preview-pane markdown-body" id="preview-pane"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/editor.ts"></script>
</body>
</html>
